[package]
name = "engine-workspace"
version = "1.2.8"
edition = "2024"
description = "A developer-only Unreal Engine workspace and release monitor"
license = "MIT"
repository = "https://github.com/revolutionart/DoNothingAndWin"

[features]
portable = []

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
time = { version = "=0.3.55", features = ["parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
fs2 = "0.4"
wry = "0.57.0"
tao = "0.37.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true


[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
